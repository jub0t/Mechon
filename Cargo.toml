[workspace]
members = [
    "crates/server",
    "crates/worker",
    "crates/cli",
    "crates/types",
    "crates/redis-utils",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "migrate"] }

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = { version = "0.15", features = ["rt_tokio_1"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
aes-gcm = "0.10"

# Config loading
config = "0.14"

# S3 / MinIO
aws-sdk-s3 = "1"
aws-config = "1"

# CLI
clap = { version = "4", features = ["derive", "color"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
indicatif = "0.17"
dirs = "5"
colored = "2"

# Worker
sysinfo = "0.30"

# Shared
mechon-types = { path = "crates/types" }
mechon-redis = { path = "crates/redis-utils" }
