# Copy this to config.toml and fill in your values.
# Environment variable overrides: MECHON__<SECTION>__<KEY>
# Example: MECHON__SERVER__SECRET_KEY=mysecret

[server]
host = "127.0.0.1"
port = 8080
# Must be at least 32 random characters. Generate with:
#   openssl rand -hex 32
secret_key = "CHANGE_ME_TO_A_RANDOM_SECRET_AT_LEAST_32_CHARS"

[database]
url = "postgresql://mechon:password@localhost:5432/mechon"
max_connections = 20

[redis]
url = "redis://127.0.0.1:6379"

# Storage backend for bot code archives.
# Use "s3" for MinIO / S3-compatible (recommended for multi-node).
# Use "local" for single-server setups.
[storage]
driver = "local"                     # "local" | "s3"
local_path = "/var/mechon/artifacts" # used when driver = "local"

# Uncomment for S3 / MinIO:
# driver = "s3"
# endpoint = "http://localhost:9000"
# bucket = "mechon-artifacts"
# access_key = "minioadmin"
# secret_key = "minioadmin"
# region = "us-east-1"
# force_path_style = true              # required for MinIO

# Worker node settings (only needed on machines running mechon-worker).
[worker]
work_dir = "/var/mechon/bots" # where bot code is extracted and run
heartbeat_interval_secs = 30
metrics_interval_secs = 10
